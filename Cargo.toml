[package]
name = "form-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "📋 A highly customizable, accessible form component library for WASM frameworks like Yew, Dioxus, and Leptos."
license = "MIT"
keywords = ["form", "yew", "dioxus", "leptos", "form-rs"]
categories = ["web-programming", "science"]
repository = "https://github.com/opensass/form-rs"
documentation = "https://docs.rs/form-rs"
authors = ["Mahmoud Harmouch <oss@wiseai.dev>"]
exclude = ["/assets", "/examples"]

[dependencies]
input-rs = { version = "0.3.0", optional = true }
yew = { version = "0.23.0", default-features = false, optional = true }
dioxus = { version = "0.7.10", optional = true }
leptos = { version = "0.8.21", optional = true }
dioxus-logger = { version = "0.7.10", optional = true }

[features]
yew = ["dep:yew", "input-rs/yew"]
dio = ["dioxus", "dioxus-logger", "input-rs/dio"]
lep = ["leptos","input-rs/lep"]

[profile.release]
opt-level = "z"
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
bump2version = "0.2.2"
